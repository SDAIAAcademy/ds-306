<section>
<h2>Day 1: Text into clean data</h2>
<ol>
<li><p>Muhannad needs the complaints split into Arabic and English for two review teams. The form records a language for every complaint. What do you use?</p><ul><li><b>A.</b> The form's language field, since every row has one</li><li><b>B.</b> The channel, since the call centre serves Arabic speakers</li><li><b>C.</b> The script of the text itself, checked against the form field on a sample</li><li><b>D.</b> A person reading every complaint and tagging it</li></ul></li>
<li><p>A colleague's script applies NFKC, removes marks, maps ة to ه and writes the result over the text column. A reviewer asks how many complaints had presentation forms. What should the script have done?</p><ul><li><b>A.</b> Written the normalised text to a new column and kept the raw text</li><li><b>B.</b> Applied NFKC only and skipped the other rules</li><li><b>C.</b> Logged the rules it applied in a comment</li><li><b>D.</b> Applied the rules in the reverse order</li></ul></li>
<li><p>The keep rule finds 576 near-identical messages from one district in ten days, all about one sewer. Dr. Ebtisam asks for the number of sewage complaints per district. What does the cleaning script do with them?</p><ul><li><b>A.</b> Keep the earliest message and drop the other 575</li><li><b>B.</b> Drop all 576 as an organised campaign</li><li><b>C.</b> Keep all 576 with no flag, since they are complaints</li><li><b>D.</b> Keep all 576, flag them, and report the count with and without the campaign</li></ul></li>
<li><p>Your script masked 7,400 values in the corpus. Ashwaq Al-Jabr must decide whether the redacted text may leave the centre's servers. Which number answers her?</p><ul><li><b>A.</b> The 7,400 values the script masked</li><li><b>B.</b> The share of values a person marked in a random sample that the script left readable</li><li><b>C.</b> The time the script takes on the whole corpus</li><li><b>D.</b> The six test numbers that all passed</li></ul></li>
<li><p>A redaction pattern for Saudi mobile numbers passes all of its tests, which are written with the digits 0 to 9. On the audited sample it misses a quarter of the phone numbers in Arabic complaints. What is the most likely cause?</p><ul><li><b>A.</b> The audited sample was marked carelessly</li><li><b>B.</b> The numbers are typed in Arabic-Indic digits, which the digit class does not cover</li><li><b>C.</b> Arabic complaints are longer, so numbers are harder to find</li><li><b>D.</b> The pattern needs a word boundary before the number</li></ul></li>
<li><p>Why does the cleaning script write normalised text to a new column instead of replacing the raw text?</p><ul><li><b>A.</b> Because the Personal Data Protection Law requires it</li><li><b>B.</b> Because normalised text takes less storage</li><li><b>C.</b> Because models cannot read the raw text</li><li><b>D.</b> Because each rule loses information on purpose, and a wrong rule must be reversible</li></ul></li>
<li><p>Near-duplicate detection finds 300 messages from one district in a week, all copied from one social media post about a broken bridge. The director asks how many problems need a crew this month. How do the 300 messages enter that count?</p><ul><li><b>A.</b> As one problem</li><li><b>B.</b> As the number of distinct phone numbers among them</li><li><b>C.</b> As 300 problems</li><li><b>D.</b> As zero, since they are a campaign</li></ul></li>
<li><p>Before computing shingles, the lab replaces numbers of seven digits or more by a symbol but keeps short numbers. What is the reason?</p><ul><li><b>A.</b> Long numbers slow MinHash down</li><li><b>B.</b> Short numbers are already removed by normalisation</li><li><b>C.</b> Long numbers are phone and identity numbers that differ between copies; short numbers such as street numbers tell places apart</li><li><b>D.</b> Short numbers are too short to form a five-character shingle</li></ul></li>
<li><p>An analyst compares the share of "English complaints" across channels using the form's language field and finds the app has twice the English share of the web form. What should be checked first?</p><ul><li><b>A.</b> Whether English complaints are longer</li><li><b>B.</b> Whether app users are more often English speakers</li><li><b>C.</b> Whether the field agrees with the script of the text in each channel</li><li><b>D.</b> Whether the app received more complaints overall</li></ul></li>
<li><p>In which order does a text-measurement pipeline at Sada run?</p><ul><li><b>A.</b> Deduplicate, classify, correct, redact</li><li><b>B.</b> Normalise, classify, redact, report</li><li><b>C.</b> Classify, redact, deduplicate, normalise</li><li><b>D.</b> Redact, normalise, deduplicate, label, correct the estimate</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Labels you can trust</h2>
<ol>
<li><p>The redaction left 26 of 122 marked names readable in the audited sample, and no phone or identity number. What follows for the release of redacted text?</p><ul><li><b>A.</b> Phone numbers are proven absent from the redacted corpus</li><li><b>B.</b> About one name in five survives: a name rule or a review is needed before release</li><li><b>C.</b> The overall miss rate of 7.7% is low enough to release</li><li><b>D.</b> The audited sample must be re-marked before anything is decided</li></ul></li>
<li><p>Pair A agrees on 94% of complaints for "staff conduct or not", with kappa 0.52. Pair B agrees on 88% for "water and sewage or not", with kappa 0.71. Staff conduct is rare. Which statement holds?</p><ul><li><b>A.</b> Pair A, since they agree more often</li><li><b>B.</b> Pair B labels water and sewage more correctly</li><li><b>C.</b> They cannot be compared at all</li><li><b>D.</b> Pair B agrees more beyond chance; Pair A's 94% is mostly agreement on "no"</li></ul></li>
<li><p>A colleague reports 0.97 accuracy for the n-gram classifier, measured on a random fifth of the 3,000 pool complaints held out from training. What is wrong with the number?</p><ul><li><b>A.</b> It is scored against routing labels nobody checked, which share the model's own training habits</li><li><b>B.</b> 600 complaints are too few to score on</li><li><b>C.</b> The held-out complaints leaked into training</li><li><b>D.</b> Accuracy should have been macro F1</li></ul></li>
<li><p>Your key failed and Lab 2.3 ran on the stand-in vectors, with 0.893 gold accuracy. Dr. Ebtisam asks whether embeddings beat the n-gram baseline. What do you answer?</p><ul><li><b>A.</b> "No: embeddings reach 0.893 against 0.930"</li><li><b>B.</b> "Yes: embeddings usually beat n-grams"</li><li><b>C.</b> "Not measured yet: the code works, the comparison needs a run with the hosted model"</li><li><b>D.</b> "Embeddings cannot be used at the centre"</li></ul></li>
<li><p>The paired difference in gold accuracy, sparse minus embedding, is +0.037 with a 95% interval from −0.003 to +0.073. Which sentence belongs in the report?</p><ul><li><b>A.</b> The two classifiers perform the same</li><li><b>B.</b> The sparse classifier is probably better by up to seven points, but a difference of zero cannot be ruled out</li><li><b>C.</b> The sparse classifier is 3.7 points better</li><li><b>D.</b> The embedding classifier may be the better one, since the interval is negative</li></ul></li>
<li><p>Three classifiers are compared. Which setup makes their scores comparable?</p><ul><li><b>A.</b> All three scored on the same held-out gold set, labelled by people</li><li><b>B.</b> Each scored on the routing labels of the training pool</li><li><b>C.</b> Each scored by the number of documents it labels per second</li><li><b>D.</b> Each scored on its own random test split</li></ul></li>
<li><p>Why do character n-grams suit a sparse classifier on Arabic complaints?</p><ul><li><b>A.</b> They need no training data</li><li><b>B.</b> They translate dialect into formal Arabic</li><li><b>C.</b> They ignore the order of letters</li><li><b>D.</b> Words with a prefix, suffix or spelling variant still share most of their n-grams</li></ul></li>
<li><p>Two classifiers reach 0.81 and 0.78 accuracy on the same 300 gold documents. Their separate 95% intervals overlap. What do you conclude?</p><ul><li><b>A.</b> The difference is not real, since the intervals overlap</li><li><b>B.</b> Compute the interval of the paired difference over the same documents before concluding</li><li><b>C.</b> The first classifier is better, since 0.81 is higher</li><li><b>D.</b> Collect a new gold set for each classifier</li></ul></li>
<li><p>Your free embedding endpoint allows 50 requests a day and takes 64 texts per request. You need vectors for a 3,000-document pool and a 300-document gold set. What is the plan?</p><ul><li><b>A.</b> One request per document, 3,300 requests</li><li><b>B.</b> Embed only the gold set and train on it</li><li><b>C.</b> Skip embeddings and report the sparse classifier only</li><li><b>D.</b> 53 requests over two days, or a subsample of the pool, with the vectors cached</li></ul></li>
<li><p>Two coders agree on 96% of documents for "parks or not". Cohen's kappa is 0.55. How can both be true?</p><ul><li><b>A.</b> The coders disagree on easy documents</li><li><b>B.</b> Kappa penalises coders who label quickly</li><li><b>C.</b> Parks is rare, so most agreement is on "not parks" and would happen by chance</li><li><b>D.</b> Kappa was computed wrongly</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Language models as instruments</h2>
<ol>
<li><p>Sparse minus embedding accuracy on the same 300 gold complaints was +0.037, interval −0.003 to +0.073. Unpaired, the interval was 0.093 wide; paired, 0.077. What made the paired interval narrower?</p><ul><li><b>A.</b> Pairing doubles the number of complaints</li><li><b>B.</b> The paired bootstrap used more resamples</li><li><b>C.</b> Complaints that are easy or hard for both classifiers cancel out in the difference</li><li><b>D.</b> Accuracy is less variable than macro F1</li></ul></li>
<li><p>The centre adds a ninth category, "heat and cooling in public buildings", with no labelled examples yet. The sparse model scores 0.930 on the old eight; Fahim 0.810. What do you use for the first month?</p><ul><li><b>A.</b> The sparse model, since it scores higher</li><li><b>B.</b> Fahim with the new category added to its prompt, checked on a small new gold sample</li><li><b>C.</b> Neither, until 3,000 new labels are collected</li><li><b>D.</b> The sparse model for the new category and Fahim for the old ones</li></ul></li>
<li><p>Prompt 1 scores 0.810 on the gold set and prompt 2 scores 0.797. A colleague says the prompts are equivalent, so the published district counts do not depend on the choice. What do you check?</p><ul><li><b>A.</b> Nothing: equal accuracy means equal counts</li><li><b>B.</b> The flip rate of prompt 1 alone</li><li><b>C.</b> Which prompt uses fewer tokens</li><li><b>D.</b> How many labels differ between the prompts, and the counts by category and district under each</li></ul></li>
<li><p>Fahim misses more sewage complaints in Gulf dialect. Al-Naseem's complaints are 60% Gulf, Al-Khalij's 13%. The naive sewage rate is published for both. Which statement holds?</p><ul><li><b>A.</b> Al-Naseem's rate is under-stated more than Al-Khalij's, so the gap between them looks smaller than it is</li><li><b>B.</b> Both are under-stated equally, so the comparison is fair</li><li><b>C.</b> Al-Naseem's rate is over-stated</li><li><b>D.</b> The rates are fine because overall accuracy is 0.81</li></ul></li>
<li><p>Fahim fails the criteria on Gulf dialect and on stability, and passes on formal Arabic and English. Dr. Ebtisam wants one recommendation. Which one follows from the evidence?</p><ul><li><b>A.</b> Replace the second coder, since overall kappa is 0.778</li><li><b>B.</b> Stop using Fahim for anything</li><li><b>C.</b> Keep both human coders; use Fahim's labels for counts only with a correction from the human sample, by variety</li><li><b>D.</b> Lower the stability criterion to 80% so that Fahim passes</li></ul></li>
<li><p>A prompted classifier uses on average 120 input and 14 output tokens per complaint at USD 0.20 and 0.40 per million tokens. What does labelling 1,000 complaints cost?</p><ul><li><b>A.</b> Nothing, since the free endpoint is used</li><li><b>B.</b> About USD 0.03</li><li><b>C.</b> About USD 0.24</li><li><b>D.</b> About USD 30</li></ul></li>
<li><p>A rate computed from model labels is published. Which record must travel with the labels so the number can be reproduced?</p><ul><li><b>A.</b> The number of complaints only</li><li><b>B.</b> A screenshot of the dashboard</li><li><b>C.</b> The model identifier, the prompt version, the settings and the date of the run</li><li><b>D.</b> The name of the analyst</li></ul></li>
<li><p>Three runs of the same prompt give different labels for 8% of the gold documents. What does this measure?</p><ul><li><b>A.</b> How much of a single run's labelling is chance at these settings</li><li><b>B.</b> The difficulty of the codebook for people</li><li><b>C.</b> A bug in the parsing code</li><li><b>D.</b> The model's accuracy</li></ul></li>
<li><p>Before reading Fahim's results, the team writes: "Replace the second coder only if model-gold kappa is at least the human pair's kappa minus 0.05 in every variety." Why write it first?</p><ul><li><b>A.</b> Because kappa cannot be computed afterwards</li><li><b>B.</b> To make the model look better</li><li><b>C.</b> Because the codebook requires it</li><li><b>D.</b> So the decision cannot be bent to fit the results</li></ul></li>
<li><p>Fahim reaches 0.85 accuracy overall and 0.66 on Gulf dialect complaints. What goes in the reliability memo?</p><ul><li><b>A.</b> The overall 0.85, since it summarises all documents</li><li><b>B.</b> Accuracy by variety with intervals, the confusion behind the gap, and its effect on counts</li><li><b>C.</b> Only the Gulf number, since it is the weakest</li><li><b>D.</b> A recommendation to remove Gulf complaints</li></ul></li>
<li><p>Model-gold kappa is 0.71, human-human kappa is 0.79, and the model is stable across runs. Gulf kappa is 0.55. What is the defensible decision?</p><ul><li><b>A.</b> Replace the second coder everywhere</li><li><b>B.</b> Use model labels for estimates only with a human-sample correction, and keep a second human coder for Gulf complaints</li><li><b>C.</b> Stop using the model entirely</li><li><b>D.</b> Retrain the human coders to agree with the model</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: From documents to tables</h2>
<ol>
<li><p>Fahim failed the criteria on Gulf dialect (kappa 0.187 below the human pair) and on stability (80.3% of complaints with three agreeing runs). What did the reliability memo recommend?</p><ul><li><b>A.</b> Stop using Fahim's labels altogether</li><li><b>B.</b> Keep the second coder; use Fahim's labels for counts, corrected with the gold set by variety</li><li><b>C.</b> Replace the coder with the majority of three runs</li><li><b>D.</b> Relax the stability criterion to 80%</li></ul></li>
<li><p>A report reads "The repair date will be set later." The defect is serious. The schema allows repair_deadline_days from 1 to 90 or null. Which extraction is right?</p><ul><li><b>A.</b> 7, the usual deadline for a serious defect</li><li><b>B.</b> 0, meaning no deadline</li><li><b>C.</b> "later"</li><li><b>D.</b> null</li></ul></li>
<li><p>Khalaf will schedule repairs from repair_deadline_days. A wrong deadline sends a crew on the wrong day; a missing one is checked by phone. Which measure answers his question?</p><ul><li><b>A.</b> The deadline field's precision, with the share of empty deadlines that stayed empty</li><li><b>B.</b> The accuracy pooled over all six fields</li><li><b>C.</b> The deadline field's recall</li><li><b>D.</b> The share of replies that passed the schema</li></ul></li>
<li><p>A colleague proposes a new quarterly figure: the share of complaints in each of the five clusters, named from their top terms. What is the main problem?</p><ul><li><b>A.</b> Five is the wrong number of clusters</li><li><b>B.</b> The silhouette is too low; a higher one would make the figure valid</li><li><b>C.</b> A cluster has no definition or measured error, and here it tracks language and a campaign more than topic</li><li><b>D.</b> The sample of 1,000 is too small</li></ul></li>
<li><p>One rectifier for all complaints (−0.030) raises every district's rate by about the same amount, 5.4 to 5.8 per 10,000. The stratified rectifiers raise Al-Naseem by 10.1 and Al-Khalij by 0.0. Which reason justifies stratifying?</p><ul><li><b>A.</b> It always gives narrower intervals</li><li><b>B.</b> It uses more gold complaints</li><li><b>C.</b> It makes all districts' rates rise equally</li><li><b>D.</b> The model's error differs by variety and districts differ in their variety mix</li></ul></li>
<li><p>An inspection report says nothing about a repair deadline. The extraction schema has `repair_deadline_days: int`. What should change?</p><ul><li><b>A.</b> Make the field optional and instruct the model to return null when the report does not state it</li><li><b>B.</b> Set a default of 14 days in the schema</li><li><b>C.</b> Drop the field from the schema</li><li><b>D.</b> Nothing: the model will pick a typical deadline</li></ul></li>
<li><p>For the deadline field, the extractor returns a value for 400 reports; 340 of them match the reference. The reference has a deadline for 350 reports. What are precision and recall?</p><ul><li><b>A.</b> Precision 0.85, recall 0.85</li><li><b>B.</b> Both 0.68, over all 500 reports</li><li><b>C.</b> Precision 0.85, recall 0.97</li><li><b>D.</b> Precision 0.97, recall 0.85</li></ul></li>
<li><p>Errors in the inspection date field occur only in reports that write dates as 05/03/2026, and only when the day is 12 or less. What is happening?</p><ul><li><b>A.</b> Arabic-Indic digits confuse the model</li><li><b>B.</b> The schema type for dates is wrong</li><li><b>C.</b> The model reads dd/mm dates as mm/dd when both readings are possible</li><li><b>D.</b> The reference extraction is wrong</li></ul></li>
<li><p>Every reply of the extractor validates against the schema. What does that prove?</p><ul><li><b>A.</b> That each value has an allowed type and range, not that it matches the report</li><li><b>B.</b> That the model did not invent values</li><li><b>C.</b> That precision and recall are 1</li><li><b>D.</b> That the extracted values are correct</li></ul></li>
<li><p>The field hazard_to_public is wrong mostly in reports that say "There is no risk to the public". Which rule would catch most of these errors before the table is used?</p><ul><li><b>A.</b> Remove the field from the schema</li><li><b>B.</b> Validate the field as a boolean</li><li><b>C.</b> Raise the model temperature</li><li><b>D.</b> Flag every true hazard whose report contains a negation of risk for review</li></ul></li>
<li><p>Model labels under-detect sewage complaints written in Gulf dialect. A district where most residents write in Gulf dialect gets a naive sewage rate from the model labels. How is that rate wrong?</p><ul><li><b>A.</b> Too high</li><li><b>B.</b> Too low, and more so than in other districts</li><li><b>C.</b> Unbiased but noisier</li><li><b>D.</b> Correct, since errors cancel across categories</li></ul></li>
<li><p>You correct a model-label rate with a human-labelled gold set. Why must the gold set be a random sample of the same corpus?</p><ul><li><b>A.</b> Because a random sample has no labelling errors</li><li><b>B.</b> Because the correction estimates the model's errors on the documents being counted</li><li><b>C.</b> Because random samples are larger</li><li><b>D.</b> Because the model was trained on it</li></ul></li>
<li><p>The gold set shows the model is accurate on English and formal Arabic and weaker on Gulf dialect. Districts differ in their mix of varieties. How do you correct district rates?</p><ul><li><b>A.</b> Drop Gulf complaints from the rate</li><li><b>B.</b> Use only the gold set to compute district rates</li><li><b>C.</b> Apply one overall correction factor to every district</li><li><b>D.</b> Estimate the correction separately by variety and apply it to each district's mix</li></ul></li>
<li><p>Why is the interval of a corrected rate wider than the interval of the naive rate?</p><ul><li><b>A.</b> Because the correction adds the uncertainty of an error rate estimated on a few hundred documents</li><li><b>B.</b> Because the corrected rate is always larger</li><li><b>C.</b> Because the naive rate has no uncertainty</li><li><b>D.</b> Because bootstrap intervals are wider than formula intervals</li></ul></li>
<li><p>A brief asks for "the share of feedback about facilities in each branch". Which measurement choice must the report state explicitly?</p><ul><li><b>A.</b> Whether copies and campaigns are counted as messages or as issues</li><li><b>B.</b> The order in which the coders labelled the gold set</li><li><b>C.</b> The colour scale of the branch map</li><li><b>D.</b> The random seed of the clustering run used to explore the corpus</li></ul></li>
<li><p>A participant wants to use a public corpus of Arabic product reviews for the capstone. What must be checked before approval?</p><ul><li><b>A.</b> That a model has been trained on it before</li><li><b>B.</b> That it is in Modern Standard Arabic only</li><li><b>C.</b> Its licence, whether it holds personal data, and whether a gold set can be built for the question in the brief</li><li><b>D.</b> Only its size</li></ul></li>
<li><p>Five clusters of 1,000 complaint vectors agree with the routing labels at an adjusted Rand index of 0.005 and with the guessed language variety at 0.642. What should the report on the clusters say?</p><ul><li><b>A.</b> The clusters group complaints by language more than by topic, so their sizes are not topic counts</li><li><b>B.</b> The routing labels are wrong, since the clusters disagree with them</li><li><b>C.</b> Five is the wrong number of clusters; more clusters would match the topics</li><li><b>D.</b> The clusters are new categories to add to the codebook</li></ul></li>
<li><p>Sada counts every one of its 20,000 complaints, then corrects the count with 300 gold complaints. Where does the interval of the corrected district rate come from?</p><ul><li><b>A.</b> From the three runs of the model</li><li><b>B.</b> There is no interval, because all complaints were counted</li><li><b>C.</b> From resampling the 20,000 complaints</li><li><b>D.</b> From the 300 gold complaints that estimate the correction</li></ul></li>
</ol>
</section>
<section>
<h2>Capstone: Capstone: a text measurement defended live</h2>
<ol>
<li><p>In the defence, the assessor asks you to re-label ten documents live and explain disagreements with your gold set. What does this check?</p><ul><li><b>A.</b> That the model agrees with you</li><li><b>B.</b> That the gold set has no errors</li><li><b>C.</b> That you can apply your codebook and that the gold set is your work</li><li><b>D.</b> That you type quickly</li></ul></li>
<li><p>In the defence the assessor asks: "Why did you correct by language variety and not with one overall correction?" Which answer defends the choice best?</p><ul><li><b>A.</b> Because stratified estimates are always more precise</li><li><b>B.</b> Because the model's error differed by variety on my gold set, and the branches differ in their variety mix; here are both numbers</li><li><b>C.</b> Because Gulf dialect is harder for every model</li><li><b>D.</b> Because the course did it that way</li></ul></li>
</ol>
</section>

ion 1","title":"Gold sets and agreement"},{"n":2,"label":"Session 2","title":"Sparse baselines"},{"n":3,"label":"Session 3","title":"Embeddings as features"},{"n":4,"label":"Session 4","title":"Comparing classifiers fairly"}]},{"n":3,"id":"day3","label":"Day 3","title":"Language models as instruments","sessions":[{"n":1,"label":"Session 1","title":"Prompted classification"},{"n":2,"label":"Session 2","title":"Ask it twice"},{"n":3,"label":"Session 3","title":"Dialect gaps"},{"n":4,"label":"Session 4","title":"Is the model a good annotator"}]},{"n":4,"id":"day4","label":"Day 4","title":"From documents to tables","sessions":[{"n":1,"label":"Session 1","title":"Schema-constrained extraction"},{"n":2,"label":"Session 2","title":"Field-level validation"},{"n":3,"label":"Session 3","title":"Structure in text"},{"n":4,"label":"Session 4","title":"Errors downstream"}]},{"n":5,"id":"capstone","label":"Capstone","title":"Capstone: a text measurement defended live","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-form-field-q1","type":"single","prompt":"Muhannad needs the complaints split into Arabic and English for two review teams. The form records a language for every complaint. What do you use?","options":[{"key":"A","text":"The form's language field, since every row has one"},{"key":"B","text":"The channel, since the call centre serves Arabic speakers"},{"key":"C","text":"The script of the text itself, checked against the form field on a sample"},{"key":"D","text":"A person reading every complaint and tagging it"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The language of a text is a property of the text. The form field disagrees with it for 8.8% of complaints, and for a quarter of the app's.","misconceptions":["Trusts a metadata field because it is complete: completeness says nothing about whether the field is right","Treats the channel as the language: every channel carries both languages","","Gives up measurement for a person's reading: possible for 40 complaints, not for 20,000"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-form-field","title":"Which split of the corpus by language can you defend?"},"level":null,"pool":"checkpoint"},{"id":"check-normalise-q1","type":"single","prompt":"A colleague's script applies NFKC, removes marks, maps ة to ه and writes the result over the text column. A reviewer asks how many complaints had presentation forms. What should the script have done?","options":[{"key":"A","text":"Written the normalised text to a new column and kept the raw text"},{"key":"B","text":"Applied NFKC only and skipped the other rules"},{"key":"C","text":"Logged the rules it applied in a comment"},{"key":"D","text":"Applied the rules in the reverse order"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each rule loses information on purpose. With the raw text kept, any count about the raw text, and any rule changed later, can be recomputed.","misconceptions":["","Thinks fewer rules means less loss: any rule that overwrites the raw text destroys the evidence","Confuses a log of what was done with the data it was done to: counts cannot be recomputed from a log","Treats a rule's order as the issue: the answer is lost whatever the order once the column is overwritten"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-normalise","title":"Which normalisation choice keeps the evidence?"},"level":null,"pool":"checkpoint"},{"id":"check-near-dups-q1","type":"single","prompt":"The keep rule finds 576 near-identical messages from one district in ten days, all about one sewer. Dr. Ebtisam asks for the number of sewage complaints per district. What does the cleaning script do with them?","options":[{"key":"A","text":"Keep the earliest message and drop the other 575"},{"key":"B","text":"Drop all 576 as an organised campaign"},{"key":"C","text":"Keep all 576 with no flag, since they are complaints"},{"key":"D","text":"Keep all 576, flag them, and report the count with and without the campaign"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"They are 576 complaints and one issue. The flag lets both counts be made, and the report states which one the rate uses.","misconceptions":["Treats a campaign as copies by one person: each message is a resident who complained","Assumes organised complaints are less real: the residents are real and the sewer overflows","Hides the decision from the reader: the count changes by 575 depending on a choice nobody sees",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-near-dups","title":"What do you do with 576 near-identical messages?"},"level":null,"pool":"checkpoint"},{"id":"check-redaction-q1","type":"single","prompt":"Your script masked 7,400 values in the corpus. Ashwaq Al-Jabr must decide whether the redacted text may leave the centre's servers. Which number answers her?","options":[{"key":"A","text":"The 7,400 values the script masked"},{"key":"B","text":"The share of values a person marked in a random sample that the script left readable"},{"key":"C","text":"The time the script takes on the whole corpus"},{"key":"D","text":"The six test numbers that all passed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only a human-marked sample shows what the script missed. Her decision rests on the miss rate by type, with an interval.","misconceptions":["Counts what was found: a large count can sit beside a large number of misses","","Measures speed, not protection: a fast script can still leak","Assumes a pattern tested on examples works on the corpus: six test strings show the formats you thought of"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-redaction","title":"What does Ashwaq need to approve the redaction?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"The redaction left 26 of 122 marked names readable in the audited sample, and no phone or identity number. What follows for the release of redacted text?","options":[{"key":"A","text":"Phone numbers are proven absent from the redacted corpus"},{"key":"B","text":"About one name in five survives: a name rule or a review is needed before release"},{"key":"C","text":"The overall miss rate of 7.7% is low enough to release"},{"key":"D","text":"The audited sample must be re-marked before anything is decided"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The misses sit in one type with a clear cause. The decision follows the type, not the average.","misconceptions":["Reads a zero on the sample as a zero in the corpus: a sample bounds the miss rate, it does not prove none","","Averages a serious gap away: the overall rate hides that the misses are all names","Blames the reference: the misses follow a clear pattern, names without a cue word"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"What does the redaction miss rate tell Ashwaq?"},"level":null,"pool":"checkpoint"},{"id":"check-kappa-q1","type":"single","prompt":"Pair A agrees on 94% of complaints for \"staff conduct or not\", with kappa 0.52. Pair B agrees on 88% for \"water and sewage or not\", with kappa 0.71. Staff conduct is rare. Which statement holds?","options":[{"key":"A","text":"Pair A, since they agree more often"},{"key":"B","text":"Pair B labels water and sewage more correctly"},{"key":"C","text":"They cannot be compared at all"},{"key":"D","text":"Pair B agrees more beyond chance; Pair A's 94% is mostly agreement on \"no\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With a rare category most agreement is on the negative and would happen by chance; kappa removes it.","misconceptions":["Ranks by raw agreement, which a rare category inflates with easy negatives","Treats kappa as accuracy: neither number says who is right","Thinks different categories make the numbers incomparable in every way: kappa is designed to compare beyond chance",""],"lo":["LO5"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-kappa","title":"Which pair of coders is more reliable?"},"level":null,"pool":"checkpoint"},{"id":"check-sparse-q1","type":"single","prompt":"A colleague reports 0.97 accuracy for the n-gram classifier, measured on a random fifth of the 3,000 pool complaints held out from training. What is wrong with the number?","options":[{"key":"A","text":"It is scored against routing labels nobody checked, which share the model's own training habits"},{"key":"B","text":"600 complaints are too few to score on"},{"key":"C","text":"The held-out complaints leaked into training"},{"key":"D","text":"Accuracy should have been macro F1"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A score is only as good as the labels it is compared with. The gold set was coded twice and adjudicated; the routing labels were not.","misconceptions":["","Thinks the size of the test set is the problem: 600 complaints is larger than the gold set","Treats a held-out split as leakage: the complaints were not used for training","Blames the metric: macro F1 would be measured against the same unchecked labels"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-sparse","title":"Where should the classifier be scored?"},"level":null,"pool":"checkpoint"},{"id":"check-embeddings-q1","type":"single","prompt":"Your key failed and Lab 2.3 ran on the stand-in vectors, with 0.893 gold accuracy. Dr. Ebtisam asks whether embeddings beat the n-gram baseline. What do you answer?","options":[{"key":"A","text":"\"No: embeddings reach 0.893 against 0.930\""},{"key":"B","text":"\"Yes: embeddings usually beat n-grams\""},{"key":"C","text":"\"Not measured yet: the code works, the comparison needs a run with the hosted model\""},{"key":"D","text":"\"Embeddings cannot be used at the centre\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A stand-in proves the pipeline runs. It says nothing about the model the question is about.","misconceptions":["Quotes a stand-in result as a model's: the stand-in is lexical and measures nothing about embeddings","Fills a gap with a general belief: no measurement on Sada's data supports it","","Treats a failed key as a reason to drop an outcome: the run can be repeated"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-embeddings","title":"What can you report from a stand-in run?"},"level":null,"pool":"checkpoint"},{"id":"check-paired-q1","type":"single","prompt":"The paired difference in gold accuracy, sparse minus embedding, is +0.037 with a 95% interval from −0.003 to +0.073. Which sentence belongs in the report?","options":[{"key":"A","text":"The two classifiers perform the same"},{"key":"B","text":"The sparse classifier is probably better by up to seven points, but a difference of zero cannot be ruled out"},{"key":"C","text":"The sparse classifier is 3.7 points better"},{"key":"D","text":"The embedding classifier may be the better one, since the interval is negative"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval states the range of differences the gold set allows: mostly in favour of the sparse model, zero just inside.","misconceptions":["Reads an interval that touches zero as proof of equality: absence of evidence is not evidence of no difference","","Ignores the interval entirely and reports the point estimate as certain","Thinks a slightly negative bound makes the embedding model better: the interval is mostly positive"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-paired","title":"How do you read +0.037 with an interval of −0.003 to +0.073?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Sparse minus embedding accuracy on the same 300 gold complaints was +0.037, interval −0.003 to +0.073. Unpaired, the interval was 0.093 wide; paired, 0.077. What made the paired interval narrower?","options":[{"key":"A","text":"Pairing doubles the number of complaints"},{"key":"B","text":"The paired bootstrap used more resamples"},{"key":"C","text":"Complaints that are easy or hard for both classifiers cancel out in the difference"},{"key":"D","text":"Accuracy is less variable than macro F1"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the complaints where exactly one classifier is right carry the difference; pairing keeps the rest from adding noise.","misconceptions":["Thinks pairing adds data: both analyses use the same 300 complaints","Confuses the number of resamples with precision: both used 2,000","","Attributes the width to the metric: both intervals are on accuracy"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"What did the paired comparison show?"},"level":null,"pool":"checkpoint"},{"id":"check-prompted-q1","type":"single","prompt":"The centre adds a ninth category, \"heat and cooling in public buildings\", with no labelled examples yet. The sparse model scores 0.930 on the old eight; Fahim 0.810. What do you use for the first month?","options":[{"key":"A","text":"The sparse model, since it scores higher"},{"key":"B","text":"Fahim with the new category added to its prompt, checked on a small new gold sample"},{"key":"C","text":"Neither, until 3,000 new labels are collected"},{"key":"D","text":"The sparse model for the new category and Fahim for the old ones"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A prompted model needs a codebook, not training labels. It must still be measured against a human sample before its labels are used.","misconceptions":["Ignores that the sparse model has never seen the new category and cannot predict it","","Assumes no labels means no measurement: a small gold sample is enough to check","Uses each model where it is weakest: the sparse model cannot route to a category it never learnt"],"lo":["LO2"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-prompted","title":"Which classifier for a category that did not exist last month?"},"level":null,"pool":"checkpoint"},{"id":"check-stability-q1","type":"single","prompt":"Prompt 1 scores 0.810 on the gold set and prompt 2 scores 0.797. A colleague says the prompts are equivalent, so the published district counts do not depend on the choice. What do you check?","options":[{"key":"A","text":"Nothing: equal accuracy means equal counts"},{"key":"B","text":"The flip rate of prompt 1 alone"},{"key":"C","text":"Which prompt uses fewer tokens"},{"key":"D","text":"How many labels differ between the prompts, and the counts by category and district under each"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A third of the labels change between the prompts while accuracy stays put. Counts are built from labels, not from accuracy.","misconceptions":["Treats equal accuracy as equal labels: the same score can come from different complaints being wrong","Checks run noise instead of the prompt effect","Changes the subject to cost: the question is whether the counts depend on the prompt",""],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-stability","title":"Two prompts, the same accuracy: are their labels interchangeable?"},"level":null,"pool":"checkpoint"},{"id":"check-dialect-q1","type":"single","prompt":"Fahim misses more sewage complaints in Gulf dialect. Al-Naseem's complaints are 60% Gulf, Al-Khalij's 13%. The naive sewage rate is published for both. Which statement holds?","options":[{"key":"A","text":"Al-Naseem's rate is under-stated more than Al-Khalij's, so the gap between them looks smaller than it is"},{"key":"B","text":"Both are under-stated equally, so the comparison is fair"},{"key":"C","text":"Al-Naseem's rate is over-stated"},{"key":"D","text":"The rates are fine because overall accuracy is 0.81"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The miss rate follows the variety, and the variety mix differs by district. The district that suffers most is under-counted most.","misconceptions":["","Assumes errors cancel across districts: the error depends on each district's language mix","Reverses the direction of the error: missed complaints lower the count","Thinks a better overall accuracy fixes a group error: the gap is in one variety"],"lo":["LO5","LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-dialect","title":"What does the dialect gap do to the published rate?"},"level":null,"pool":"checkpoint"},{"id":"check-annotator-q1","type":"single","prompt":"Fahim fails the criteria on Gulf dialect and on stability, and passes on formal Arabic and English. Dr. Ebtisam wants one recommendation. Which one follows from the evidence?","options":[{"key":"A","text":"Replace the second coder, since overall kappa is 0.778"},{"key":"B","text":"Stop using Fahim for anything"},{"key":"C","text":"Keep both human coders; use Fahim's labels for counts only with a correction from the human sample, by variety"},{"key":"D","text":"Lower the stability criterion to 80% so that Fahim passes"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Per-complaint use needs every label to be good enough; a count can be corrected for measured errors.","misconceptions":["Ignores the failed criteria because the overall numbers look acceptable","Discards labels that are usable for estimates with a correction","","Moves the bar after the results: the criteria were set before looking"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-annotator","title":"What does the memo recommend?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Fahim failed the criteria on Gulf dialect (kappa 0.187 below the human pair) and on stability (80.3% of complaints with three agreeing runs). What did the reliability memo recommend?","options":[{"key":"A","text":"Stop using Fahim's labels altogether"},{"key":"B","text":"Keep the second coder; use Fahim's labels for counts, corrected with the gold set by variety"},{"key":"C","text":"Replace the coder with the majority of three runs"},{"key":"D","text":"Relax the stability criterion to 80%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A label used one complaint at a time must be right; a count can be corrected for errors measured on a human sample. Session 4 does that correction.","misconceptions":["Treats a failed annotator test as a ban on any use: counts can be corrected","","Takes the majority vote as a fix for a systematic error: votes cancel noise, not bias","Moves the bar after the results were known"],"lo":["LO5"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"What did the criteria decide?"},"level":null,"pool":"checkpoint"},{"id":"check-extraction-q1","type":"single","prompt":"A report reads \"The repair date will be set later.\" The defect is serious. The schema allows repair_deadline_days from 1 to 90 or null. Which extraction is right?","options":[{"key":"A","text":"7, the usual deadline for a serious defect"},{"key":"B","text":"0, meaning no deadline"},{"key":"C","text":"\"later\""},{"key":"D","text":"null"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An empty field is honest and countable. Any number would be read as a deadline by the schedule.","misconceptions":["Fills the field from the severity table: a plausible value the report never gave","Uses a number as a code for missing: it passes as a real deadline downstream and fails the 1 to 90 range","Puts text in a whole-number field: the schema rejects it",""],"lo":["LO3"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-extraction","title":"What should come back for a field the report does not state?"},"level":null,"pool":"checkpoint"},{"id":"check-field-q1","type":"single","prompt":"Khalaf will schedule repairs from repair_deadline_days. A wrong deadline sends a crew on the wrong day; a missing one is checked by phone. Which measure answers his question?","options":[{"key":"A","text":"The deadline field's precision, with the share of empty deadlines that stayed empty"},{"key":"B","text":"The accuracy pooled over all six fields"},{"key":"C","text":"The deadline field's recall"},{"key":"D","text":"The share of replies that passed the schema"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"His costly error is a deadline given that is wrong or invented: that is precision, and the empties are where invention happens.","misconceptions":["","Uses the pooled figure, which mixes the easy fields with the one that matters","Measures found values, while his cost is in wrong and invented ones","Confuses a valid reply with a right one: invented deadlines are valid"],"lo":["LO3"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-field","title":"Which number tells Khalaf whether to trust the deadlines?"},"level":null,"pool":"checkpoint"},{"id":"check-clusters-q1","type":"single","prompt":"A colleague proposes a new quarterly figure: the share of complaints in each of the five clusters, named from their top terms. What is the main problem?","options":[{"key":"A","text":"Five is the wrong number of clusters"},{"key":"B","text":"The silhouette is too low; a higher one would make the figure valid"},{"key":"C","text":"A cluster has no definition or measured error, and here it tracks language and a campaign more than topic"},{"key":"D","text":"The sample of 1,000 is too small"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A category has a codebook, a gold set and an error rate. A cluster is a way to look, and it moves with the vectors, the sample and k.","misconceptions":["Treats the choice of k as the only issue: any k has the same problem","Thinks a better silhouette makes clusters into categories","","Blames the sample size: more complaints would sharpen, not define, the clusters"],"lo":["LO2","LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-clusters","title":"Can a cluster's size be published as a topic count?"},"level":null,"pool":"checkpoint"},{"id":"check-corrected-q1","type":"single","prompt":"One rectifier for all complaints (−0.030) raises every district's rate by about the same amount, 5.4 to 5.8 per 10,000. The stratified rectifiers raise Al-Naseem by 10.1 and Al-Khalij by 0.0. Which reason justifies stratifying?","options":[{"key":"A","text":"It always gives narrower intervals"},{"key":"B","text":"It uses more gold complaints"},{"key":"C","text":"It makes all districts' rates rise equally"},{"key":"D","text":"The model's error differs by variety and districts differ in their variety mix"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A single rectifier spreads the Gulf under-count over every district; stratifying puts it where the Gulf complaints are.","misconceptions":["Thinks stratifying always narrows intervals: smaller strata can widen them","Confuses the gold set's size with its strata: the 300 complaints stay the same","Inverts the logic: the variety mix is the reason, not a side effect",""],"lo":["LO4","LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-corrected","title":"Why stratify the correction by variety?"},"level":null,"pool":"checkpoint"},{"id":"q-arabic-indic-phone","type":"single","prompt":"A redaction pattern for Saudi mobile numbers passes all of its tests, which are written with the digits 0 to 9. On the audited sample it misses a quarter of the phone numbers in Arabic complaints. What is the most likely cause?","options":[{"key":"A","text":"The audited sample was marked carelessly"},{"key":"B","text":"The numbers are typed in Arabic-Indic digits, which the digit class does not cover"},{"key":"C","text":"Arabic complaints are longer, so numbers are harder to find"},{"key":"D","text":"The pattern needs a word boundary before the number"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Tests written only with Western digits cannot show a gap for Arabic-Indic digits; a digit class such as [0-9٠-٩] closes it.","misconceptions":["Blames the reference before the tool: a quarter of one script points to a pattern gap, not to random marking errors","","Treats length as the cause: a pattern matches the same at any position in the text","Adds a fix for a different problem: boundaries do not make a digit class match other digits"],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-normalise-new-column","type":"single","prompt":"Why does the cleaning script write normalised text to a new column instead of replacing the raw text?","options":[{"key":"A","text":"Because the Personal Data Protection Law requires it"},{"key":"B","text":"Because normalised text takes less storage"},{"key":"C","text":"Because models cannot read the raw text"},{"key":"D","text":"Because each rule loses information on purpose, and a wrong rule must be reversible"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Normalisation merges spellings deliberately; keeping the raw text lets any count about it, and any changed rule, be recomputed.","misconceptions":["Attributes an engineering habit to a law: the reason is reproducibility","Confuses a side effect with the reason: storage is not what is at stake","Assumes models need normalised text: many read raw text; the choice is about evidence",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-campaign-count","type":"single","prompt":"Near-duplicate detection finds 300 messages from one district in a week, all copied from one social media post about a broken bridge. The director asks how many problems need a crew this month. How do the 300 messages enter that count?","options":[{"key":"A","text":"As one problem"},{"key":"B","text":"As the number of distinct phone numbers among them"},{"key":"C","text":"As 300 problems"},{"key":"D","text":"As zero, since they are a campaign"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is about issues, and the campaign describes one issue; the residents count belongs to a question about complaints.","misconceptions":["","Counts residents, which answers a different question","Counts messages where the question asks about issues","Assumes organised complaints describe no real problem"],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-shingle-digits","type":"single","prompt":"Before computing shingles, the lab replaces numbers of seven digits or more by a symbol but keeps short numbers. What is the reason?","options":[{"key":"A","text":"Long numbers slow MinHash down"},{"key":"B","text":"Short numbers are already removed by normalisation"},{"key":"C","text":"Long numbers are phone and identity numbers that differ between copies; short numbers such as street numbers tell places apart"},{"key":"D","text":"Short numbers are too short to form a five-character shingle"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Masking what varies between copies and keeping what separates places makes the similarity reflect the message.","misconceptions":["Treats it as a speed trick: the number of shingles barely changes","Confuses digit translation with removal: normalisation keeps digits","","Thinks shingles are cut per token: a shingle runs across spaces and digits alike"],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-form-field-split","type":"single","prompt":"An analyst compares the share of \"English complaints\" across channels using the form's language field and finds the app has twice the English share of the web form. What should be checked first?","options":[{"key":"A","text":"Whether English complaints are longer"},{"key":"B","text":"Whether app users are more often English speakers"},{"key":"C","text":"Whether the field agrees with the script of the text in each channel"},{"key":"D","text":"Whether the app received more complaints overall"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A metadata field is a measurement with its own errors; in the Sada corpus the app default makes a quarter of its \"English\" rows Arabic.","misconceptions":["Checks a property unrelated to how the field was recorded","Accepts the field as truth and explains the pattern it shows","","Confuses a share with a count: the comparison is already a share"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-gold-held-out","type":"single","prompt":"Three classifiers are compared. Which setup makes their scores comparable?","options":[{"key":"A","text":"All three scored on the same held-out gold set, labelled by people"},{"key":"B","text":"Each scored on the routing labels of the training pool"},{"key":"C","text":"Each scored by the number of documents it labels per second"},{"key":"D","text":"Each scored on its own random test split"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The same documents with the same human labels remove the documents as a source of difference.","misconceptions":["","Scores on noisy labels that two of the classifiers were trained on","Replaces quality with speed","Thinks any held-out data is enough: different documents add sampling noise to the comparison"],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-char-ngrams-arabic","type":"single","prompt":"Why do character n-grams suit a sparse classifier on Arabic complaints?","options":[{"key":"A","text":"They need no training data"},{"key":"B","text":"They translate dialect into formal Arabic"},{"key":"C","text":"They ignore the order of letters"},{"key":"D","text":"Words with a prefix, suffix or spelling variant still share most of their n-grams"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Arabic attaches articles and pronouns to words; character pieces let الحديقة and حديقتنا share evidence.","misconceptions":["Confuses features with a model: the classifier still learns from labelled data","Expects features to translate: they only split text into pieces","Gets the mechanism backwards: n-grams keep short-range letter order",""],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-paired-bootstrap","type":"single","prompt":"Two classifiers reach 0.81 and 0.78 accuracy on the same 300 gold documents. Their separate 95% intervals overlap. What do you conclude?","options":[{"key":"A","text":"The difference is not real, since the intervals overlap"},{"key":"B","text":"Compute the interval of the paired difference over the same documents before concluding"},{"key":"C","text":"The first classifier is better, since 0.81 is higher"},{"key":"D","text":"Collect a new gold set for each classifier"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"On the same documents, the paired difference has a much narrower interval than each accuracy on its own.","misconceptions":["Reads overlapping separate intervals as no difference: pairing removes the shared document noise","","Ignores sampling noise entirely","Throws away the pairing, which is the strength of the design"],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-cost-per-thousand","type":"single","prompt":"A prompted classifier uses on average 120 input and 14 output tokens per complaint at USD 0.20 and 0.40 per million tokens. What does labelling 1,000 complaints cost?","options":[{"key":"A","text":"Nothing, since the free endpoint is used"},{"key":"B","text":"About USD 0.03"},{"key":"C","text":"About USD 0.24"},{"key":"D","text":"About USD 30"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"1,000 x (120 x 0.20 + 14 x 0.40) / 1,000,000 is about USD 0.03; the free endpoint caps requests, it does not make volume free.","misconceptions":["Confuses the free tier, limited to a number of requests a day, with the cost at volume","","Multiplies the input tokens by both prices","Treats the price as per thousand tokens instead of per million"],"lo":["LO2"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-embedding-budget","type":"single","prompt":"Your free embedding endpoint allows 50 requests a day and takes 64 texts per request. You need vectors for a 3,000-document pool and a 300-document gold set. What is the plan?","options":[{"key":"A","text":"One request per document, 3,300 requests"},{"key":"B","text":"Embed only the gold set and train on it"},{"key":"C","text":"Skip embeddings and report the sparse classifier only"},{"key":"D","text":"53 requests over two days, or a subsample of the pool, with the vectors cached"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"3,300 texts in batches of 64 are 52 to 53 requests; caching makes a rerun cost nothing.","misconceptions":["Ignores batching, which the endpoint supports","Trains and scores on the same documents","Drops an outcome instead of planning within the budget",""],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-null-not-invented","type":"single","prompt":"An inspection report says nothing about a repair deadline. The extraction schema has `repair_deadline_days: int`. What should change?","options":[{"key":"A","text":"Make the field optional and instruct the model to return null when the report does not state it"},{"key":"B","text":"Set a default of 14 days in the schema"},{"key":"C","text":"Drop the field from the schema"},{"key":"D","text":"Nothing: the model will pick a typical deadline"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A required field pushes a model to invent; an optional field with an explicit null keeps absence measurable.","misconceptions":["","Hides the absence behind a number that looks measured","Loses the field for the 70% of reports that state it","Accepts an invented value as an extraction"],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-field-precision","type":"single","prompt":"For the deadline field, the extractor returns a value for 400 reports; 340 of them match the reference. The reference has a deadline for 350 reports. What are precision and recall?","options":[{"key":"A","text":"Precision 0.85, recall 0.85"},{"key":"B","text":"Both 0.68, over all 500 reports"},{"key":"C","text":"Precision 0.85, recall 0.97"},{"key":"D","text":"Precision 0.97, recall 0.85"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Precision is 340 of the 400 returned values; recall is 340 of the 350 reference values.","misconceptions":["Uses one denominator for both","Divides by all reports, mixing in the ones with nothing to find","","Swaps the denominators: precision is over what the extractor returned"],"lo":["LO3"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-day-month-swap","type":"single","prompt":"Errors in the inspection date field occur only in reports that write dates as 05/03/2026, and only when the day is 12 or less. What is happening?","options":[{"key":"A","text":"Arabic-Indic digits confuse the model"},{"key":"B","text":"The schema type for dates is wrong"},{"key":"C","text":"The model reads dd/mm dates as mm/dd when both readings are possible"},{"key":"D","text":"The reference extraction is wrong"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A date valid under both orders passes validation; only a rule that states the order, or a check against the visit log, catches it.","misconceptions":["Names a cause the condition does not mention","Validation passes: both readings are valid dates","","Blames the reference without checking a pattern that has a clear cause"],"lo":["LO3"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-validation-not-accuracy","type":"single","prompt":"Every reply of the extractor validates against the schema. What does that prove?","options":[{"key":"A","text":"That each value has an allowed type and range, not that it matches the report"},{"key":"B","text":"That the model did not invent values"},{"key":"C","text":"That precision and recall are 1"},{"key":"D","text":"That the extracted values are correct"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Validation checks shape and allowed values; field-level precision and recall against a reference check content.","misconceptions":["","An invented value can be perfectly valid","Treats validation as an evaluation against a reference","Confuses valid shape with correct content"],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-negation","type":"single","prompt":"The field hazard_to_public is wrong mostly in reports that say \"There is no risk to the public\". Which rule would catch most of these errors before the table is used?","options":[{"key":"A","text":"Remove the field from the schema"},{"key":"B","text":"Validate the field as a boolean"},{"key":"C","text":"Raise the model temperature"},{"key":"D","text":"Flag every true hazard whose report contains a negation of risk for review"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A targeted consistency rule turns a known error pattern into a review queue.","misconceptions":["Loses the field instead of checking it","It already is one: the error is in the value","Adds randomness, not reading accuracy",""],"lo":["LO3"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-naive-biased","type":"single","prompt":"Model labels under-detect sewage complaints written in Gulf dialect. A district where most residents write in Gulf dialect gets a naive sewage rate from the model labels. How is that rate wrong?","options":[{"key":"A","text":"Too high"},{"key":"B","text":"Too low, and more so than in other districts"},{"key":"C","text":"Unbiased but noisier"},{"key":"D","text":"Correct, since errors cancel across categories"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A systematic miss in one variety becomes an under-count where that variety is common.","misconceptions":["Reverses the direction: missed complaints lower the count","","Treats a systematic error as random","Assumes errors cancel: missed sewage complaints land in other categories"],"lo":["LO4"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-correction-sample","type":"single","prompt":"You correct a model-label rate with a human-labelled gold set. Why must the gold set be a random sample of the same corpus?","options":[{"key":"A","text":"Because a random sample has no labelling errors"},{"key":"B","text":"Because the correction estimates the model's errors on the documents being counted"},{"key":"C","text":"Because random samples are larger"},{"key":"D","text":"Because the model was trained on it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The correction transfers the error rate measured on the sample to the corpus; that holds only when the sample represents the corpus.","misconceptions":["Randomness does not remove human error","","Confuses randomness with size","The gold set must not be training data"],"lo":["LO4"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-stratify-language","type":"single","prompt":"The gold set shows the model is accurate on English and formal Arabic and weaker on Gulf dialect. Districts differ in their mix of varieties. How do you correct district rates?","options":[{"key":"A","text":"Drop Gulf complaints from the rate"},{"key":"B","text":"Use only the gold set to compute district rates"},{"key":"C","text":"Apply one overall correction factor to every district"},{"key":"D","text":"Estimate the correction separately by variety and apply it to each district's mix"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Stratifying the correction by variety lets each district get the error rates of the language its residents write in.","misconceptions":["Removes the group that is under-counted","Throws away the model labels: 300 documents are too few per district","Assumes one error rate fits districts with different mixes",""],"lo":["LO4"],"day":4,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-interval-corrected","type":"single","prompt":"Why is the interval of a corrected rate wider than the interval of the naive rate?","options":[{"key":"A","text":"Because the correction adds the uncertainty of an error rate estimated on a few hundred documents"},{"key":"B","text":"Because the corrected rate is always larger"},{"key":"C","text":"Because the naive rate has no uncertainty"},{"key":"D","text":"Because bootstrap intervals are wider than formula intervals"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The naive interval is narrow and centred in the wrong place; the corrected one is honest about how well the error is known.","misconceptions":["","Confuses width with level","A count from 20,000 labels has little sampling noise but a bias the interval does not show","Blames the method, not the source of uncertainty"],"lo":["LO4"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-version-record","type":"single","prompt":"A rate computed from model labels is published. Which record must travel with the labels so the number can be reproduced?","options":[{"key":"A","text":"The number of complaints only"},{"key":"B","text":"A screenshot of the dashboard"},{"key":"C","text":"The model identifier, the prompt version, the settings and the date of the run"},{"key":"D","text":"The name of the analyst"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Model and prompt versions decide the labels; without them a rerun cannot be matched to the published number.","misconceptions":["Too little: two runs on the same complaints can differ","Records the result, not how it was made","","Records who, not what produced the labels"],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-kappa-prevalence","type":"single","prompt":"Two coders agree on 96% of documents for \"parks or not\". Cohen's kappa is 0.55. How can both be true?","options":[{"key":"A","text":"The coders disagree on easy documents"},{"key":"B","text":"Kappa penalises coders who label quickly"},{"key":"C","text":"Parks is rare, so most agreement is on \"not parks\" and would happen by chance"},{"key":"D","text":"Kappa was computed wrongly"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With a rare category, chance agreement is high; kappa measures agreement beyond it.","misconceptions":["Invents a cause the numbers do not show","Kappa knows nothing about speed","","Distrusts the statistic instead of reading it"],"lo":["LO5"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-stability-meaning","type":"single","prompt":"Three runs of the same prompt give different labels for 8% of the gold documents. What does this measure?","options":[{"key":"A","text":"How much of a single run's labelling is chance at these settings"},{"key":"B","text":"The difficulty of the codebook for people"},{"key":"C","text":"A bug in the parsing code"},{"key":"D","text":"The model's accuracy"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Run-to-run disagreement is the instrument's noise; a single run carries it silently.","misconceptions":["","Measures the model, not the coders","Assumes variation must be a bug","Confuses agreement with itself and agreement with the truth"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-criteria-first","type":"single","prompt":"Before reading Fahim's results, the team writes: \"Replace the second coder only if model-gold kappa is at least the human pair's kappa minus 0.05 in every variety.\" Why write it first?","options":[{"key":"A","text":"Because kappa cannot be computed afterwards"},{"key":"B","text":"To make the model look better"},{"key":"C","text":"Because the codebook requires it"},{"key":"D","text":"So the decision cannot be bent to fit the results"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Criteria set after the results invite moving the bar to where the results land.","misconceptions":["Mistakes a matter of order for one of feasibility","Gets the purpose backwards","Attributes a research practice to the codebook",""],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dialect-gap-report","type":"single","prompt":"Fahim reaches 0.85 accuracy overall and 0.66 on Gulf dialect complaints. What goes in the reliability memo?","options":[{"key":"A","text":"The overall 0.85, since it summarises all documents"},{"key":"B","text":"Accuracy by variety with intervals, the confusion behind the gap, and its effect on counts"},{"key":"C","text":"Only the Gulf number, since it is the weakest"},{"key":"D","text":"A recommendation to remove Gulf complaints"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A gap is reported by group, explained by its confusions and traced to the estimates it biases.","misconceptions":["Hides a group behind an average","","Reports one group without the comparison that makes it a gap","Excludes the group that is under-counted"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-replace-coder","type":"single","prompt":"Model-gold kappa is 0.71, human-human kappa is 0.79, and the model is stable across runs. Gulf kappa is 0.55. What is the defensible decision?","options":[{"key":"A","text":"Replace the second coder everywhere"},{"key":"B","text":"Use model labels for estimates only with a human-sample correction, and keep a second human coder for Gulf complaints"},{"key":"C","text":"Stop using the model entirely"},{"key":"D","text":"Retrain the human coders to agree with the model"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision follows the evidence by group: usable with correction where it is close to people, not where it is not.","misconceptions":["Ignores the gap in one variety","","Ignores that the labels are usable with correction","Treats the model as the reference"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-pipeline-order","type":"single","prompt":"In which order does a text-measurement pipeline at Sada run?","options":[{"key":"A","text":"Deduplicate, classify, correct, redact"},{"key":"B","text":"Normalise, classify, redact, report"},{"key":"C","text":"Classify, redact, deduplicate, normalise"},{"key":"D","text":"Redact, normalise, deduplicate, label, correct the estimate"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Personal data leaves first, then the text is made comparable, copies are handled, labels are made and the estimate is corrected.","misconceptions":["Redacts last, after the text has gone to a model","Reports without a correction and redacts too late","Sends personal data to a model before redaction",""],"lo":["LO6"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-brief-question","type":"single","prompt":"A brief asks for \"the share of feedback about facilities in each branch\". Which measurement choice must the report state explicitly?","options":[{"key":"A","text":"Whether copies and campaigns are counted as messages or as issues"},{"key":"B","text":"The order in which the coders labelled the gold set"},{"key":"C","text":"The colour scale of the branch map"},{"key":"D","text":"The random seed of the clustering run used to explore the corpus"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The unit counted changes the share; the report states it and gives the other count beside it.","misconceptions":["","Order may affect fatigue, but the share is computed from the labels, not their order","A presentation choice, not a measurement choice","A cluster run that does not feed the share cannot change it"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-defence-relabel","type":"single","prompt":"In the defence, the assessor asks you to re-label ten documents live and explain disagreements with your gold set. What does this check?","options":[{"key":"A","text":"That the model agrees with you"},{"key":"B","text":"That the gold set has no errors"},{"key":"C","text":"That you can apply your codebook and that the gold set is your work"},{"key":"D","text":"That you type quickly"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Re-labelling from the codebook shows the participant owns the instrument the whole project rests on.","misconceptions":["The model is not part of this check","Disagreements are expected; explaining them is the point","","Confuses the check with a speed test"],"lo":["LO6"],"day":5,"session":null,"slide":null,"level":"understand","pool":"practice"},{"id":"q-public-corpus","type":"single","prompt":"A participant wants to use a public corpus of Arabic product reviews for the capstone. What must be checked before approval?","options":[{"key":"A","text":"That a model has been trained on it before"},{"key":"B","text":"That it is in Modern Standard Arabic only"},{"key":"C","text":"Its licence, whether it holds personal data, and whether a gold set can be built for the question in the brief"},{"key":"D","text":"Only its size"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The capstone needs a corpus it may use, that is safe to process, and on which agreement and model results can be measured.","misconceptions":["Irrelevant to whether it may be used here","Excludes dialect, which the course wants measured","","Size says nothing about licence or personal data"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-cluster-language","type":"single","prompt":"Five clusters of 1,000 complaint vectors agree with the routing labels at an adjusted Rand index of 0.005 and with the guessed language variety at 0.642. What should the report on the clusters say?","options":[{"key":"A","text":"The clusters group complaints by language more than by topic, so their sizes are not topic counts"},{"key":"B","text":"The routing labels are wrong, since the clusters disagree with them"},{"key":"C","text":"Five is the wrong number of clusters; more clusters would match the topics"},{"key":"D","text":"The clusters are new categories to add to the codebook"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A cluster shows what the vectors see. Here that is mostly language, so the report describes it as a lens and keeps topic counts to the coded categories.","misconceptions":["","Treats an unsupervised grouping as the reference for labels it was never asked to match","Assumes changing k removes what the vectors encode; the language signal stays at any k","Promotes a grouping with no definition or measured error to a category"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-census-interval","type":"single","prompt":"Sada counts every one of its 20,000 complaints, then corrects the count with 300 gold complaints. Where does the interval of the corrected district rate come from?","options":[{"key":"A","text":"From the three runs of the model"},{"key":"B","text":"There is no interval, because all complaints were counted"},{"key":"C","text":"From resampling the 20,000 complaints"},{"key":"D","text":"From the 300 gold complaints that estimate the correction"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The counts have no sampling error, but the rectifiers do: they are estimated from 300 complaints, so the bootstrap resamples those, within each variety.","misconceptions":["Run variation was measured on Day 3; the rate uses one recorded run","Forgets that the correction itself is estimated from a sample","Treats a census as a sample: every complaint received is already counted",""],"lo":["LO4"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-defend-stratify","type":"single","prompt":"In the defence the assessor asks: \"Why did you correct by language variety and not with one overall correction?\" Which answer defends the choice best?","options":[{"key":"A","text":"Because stratified estimates are always more precise"},{"key":"B","text":"Because the model's error differed by variety on my gold set, and the branches differ in their variety mix; here are both numbers"},{"key":"C","text":"Because Gulf dialect is harder for every model"},{"key":"D","text":"Because the course did it that way"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A measurement choice is defended with the project's own numbers: the measured difference in error and the difference in mix that makes it matter.","misconceptions":["States a general rule that is false: small strata can widen intervals","","Generalises without the project's own measurement","Appeals to authority instead of evidence from the project"],"lo":["LO6"],"day":5,"session":null,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
