[project]
name = "ds-306-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course Text and Unstructured Data for Data Science"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pydantic>=2.9",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "jupyterlab>=4.4",
]

[tool.uv]
package = false
